        .auth-link { text-align: center; margin-top: 15px; }
        .auth-link a { color: #1a3a5c; }
        
        .dashboard { display: none; }
        .dashboard.active { display: flex; }
        
        .sidebar { 
            width: 320px; 
            background: #1a3a5c; 
            color: white; 
            height: 100vh;
            position: fixed; 
            left: 0; 
            top: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: #0f2a44; }
        .sidebar::-webkit-scrollbar-thumb { background: #2c5a8c; border-radius: 3px; }
        
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .sidebar-header h2 { font-size: 18px; margin-bottom: 10px; }
        .user-name { font-size: 14px; opacity: 0.8; }
        
        .nav-menu { flex: 1; padding: 10px 0 20px 0; }
        .nav-item { 
            display: block; 
            width: 100%; 
            padding: 12px 20px; 
            background: none; 
            border: none; 
            color: white; 
            text-align: left; 
            cursor: pointer; 
            font-size: 13px; 
            transition: background 0.2s;
            white-space: normal;
            word-wrap: break-word;
        }
        .nav-item:hover, .nav-item.active { background: #2c5a8c; }
        .nav-divider { 
            padding: 15px 20px 5px; 
            font-size: 11px; 
            text-transform: uppercase; 
            opacity: 0.6; 
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .logout-btn { 
            margin: 20px; 
            width: calc(100% - 40px); 
            padding: 10px; 
            background: #dc3545; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .content { margin-left: 320px; padding: 20px; flex: 1; min-height: 100vh; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-primary { background: #1a5c8c; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-danger { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-warning { background: #ffc107; color: #333; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-export { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f8f9fa; }
        .loading, .empty { text-align: center; padding: 40px; color: #666; }
        
        .profile-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .profile-item { padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .profile-item strong { display: block; font-size: 12px; color: #666; }

    async function api(url, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (currentToken) options.headers['Authorization'] = `Bearer ${currentToken}`;
        if (body) options.body = JSON.stringify(body);
        
        const response = await fetch(`${API_URL}${url}`, options);
        if (response.status === 401) { 
            localStorage.removeItem('token'); 
            currentToken = null; 
            showLogin(); 
            throw new Error('Сессия истекла');
        }
        if (!response.ok) {
            const error = await response.text();
            throw new Error(error || 'Ошибка запроса');
        }
        if (response.status === 204) return null;
        return await response.json();
    }

    async function exportData(moduleName, type) {
        const module = MODULES[moduleName];
        if (!module) return;
        
        let url = '';
        if (moduleName === 'achievements') {
            url = type === 'excel' ? '/api/StudentAchievements/export-excel' : '/api/StudentAchievements/export-pdf';
        } else {
            url = type === 'excel' ? `${module.exportBase}/export-excel` : `${module.exportBase}/export-pdf`;
        }
        
        try {
            const response = await fetch(`${API_URL}${url}`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${currentToken}` }
            });
            if (!response.ok) throw new Error('Ошибка экспорта');
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `${module.title}_${new Date().toISOString().slice(0,10)}.${type === 'excel' ? 'xlsx' : 'pdf'}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(downloadUrl);
        } catch (error) {
            alert('Ошибка экспорта: ' + error.message);
        }
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) return dateString;
        try {
            const date = new Date(dateString);
            return date.toISOString().split('T')[0];
        } catch {
            return dateString;
        }
    }

    async function downloadPassport() {
        try {
            const response = await fetch(`${API_URL}/api/Passport/export-pdf`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${currentToken}` }
            });
            if (!response.ok) throw new Error('Ошибка');
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Модельный_паспорт_${new Date().toISOString().slice(0,10)}.pdf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        } catch (error) {
            alert('Ошибка скачивания: ' + error.message);
        }
    }

                for (const item of specialtiesCache) {

    function openModal(title, bodyHtml) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = bodyHtml;
        document.getElementById('modal').style.display = 'flex';
    }

    function loadPage(page) {
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.nav-item[data-page="${page}"]`);
        if (page === 'home') loadHome();
        else if (page === 'passport') loadPassport();
        else if (page === 'methodist') loadMethodistPassport();
        else loadModule(page);
    }

    // Авторизация
    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const res = await api('/api/Auth/login', 'POST', { 
                email: document.getElementById('loginEmail').value, 
                password: document.getElementById('loginPassword').value 
            });
            currentToken = res.token;
            localStorage.setItem('token', currentToken);
            showDashboard();
        } catch (err) {
            alert('Ошибка входа: ' + err.message);
        }
    });

    document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const role = document.getElementById('regRole').value;
        const lastName = document.getElementById('regLastName').value;
        const firstName = document.getElementById('regFirstName').value;
        const middleName = document.getElementById('regMiddleName').value;
        const position = document.getElementById('regPosition').value;
        const workplace = document.getElementById('regWorkplace').value;
        
        try {
            const res = await api('/api/Auth/register', 'POST', { email, password, role });
            currentToken = res.token;
            localStorage.setItem('token', currentToken);
            
            // Создаём профиль преподавателя
            try {
                await api('/api/Auth/update-profile', 'PUT', {
                    lastName: lastName,
                    firstName: firstName,
                    middleName: middleName,
                    position: position,
                    workplace: workplace
                });
            } catch (profileError) {
                console.log('Profile update may need manual creation');
            }
            
            showDashboard();
        } catch (err) {
            alert('Ошибка регистрации: ' + err.message);
        }
    });

    document.getElementById('showRegisterLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('registerContainer').style.display = 'flex';
    });

    document.getElementById('showLoginLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('registerContainer').style.display = 'none';
        document.getElementById('loginContainer').style.display = 'flex';
    });

    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        localStorage.removeItem('token');
        currentToken = null;
        showLogin();
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => loadPage(btn.dataset.page));
    });

    document.getElementById('modalCancelBtn')?.addEventListener('click', closeModal);

    if (currentToken) showDashboard();
    else showLogin();
